<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Iqra University Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #b3d9f2;
            background-image: url('iu_bg.jpg'), url('https://app.iqra.edu.pk/odoocms_assets/static/img/iu_bg.jpg');
            background-size: cover;
            background-position: left center; /* Mobile: Only the blue sky region of iu_bg.jpg is shown */
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Desktop Left Curve Area matching live IU Portal */
        .curve-panel {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            body {
                background-position: right center; /* Desktop: Building with blue IU logo on right */
                display: block;
                padding: 0;
            }

            .curve-panel {
                position: absolute;
                top: -20px;
                left: 0;
                width: 65em;
                max-width: 100vw;
                background-image: url('curve_image.png'), url('https://app.iqra.edu.pk/aarsol_custom_loginpage/static/img/image.png');
                background-size: 65em;
                background-repeat: no-repeat;
                padding: 75px 0 210px 75px;
                box-sizing: border-box;
                margin: 0;
            }
        }

        .login-card {
            width: 100%;
            max-width: 320px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .login-card {
                max-width: 270px;
                margin: 0;
            }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .login-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13.5px;
            color: #212529;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 8px 16px;
            border: 1px solid #c8d7e6;
            border-radius: 20px;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.2)) !important;
            font-size: 13px;
            color: #333333;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: #1D2C55;
            background: #ffffff !important;
        }

        .form-control::placeholder {
            color: #7a8b9e;
            font-size: 12.5px;
        }

        .actions-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 18px;
            gap: 8px;
        }

        .btn-outline-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 7px 18px;
            border: 1px solid #1D2C55;
            border-radius: 6px;
            background: transparent;
            color: #1D2C55;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 180px;
            box-sizing: border-box;
        }

        .btn-outline-primary:hover {
            background-color: #1D2C55;
            color: #ffffff;
        }

        .btn-outline-primary img {
            height: 18px;
            width: auto;
            display: block;
        }

        .btn-outline-primary svg {
            display: block;
            flex-shrink: 0;
        }

        .divider-text {
            color: #1D2C55;
            font-size: 13px;
            font-weight: 500;
            margin: 2px 0;
        }
    </style>
</head>

<body>

    <!-- Login Area with Desktop Curve Container -->
    <div class="curve-panel">
        <div class="login-card">
            <form id="loginForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label class="login-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter Username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="login-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password" autocomplete="current-password">
                </div>

                <div class="actions-container">
                    <button type="button" class="btn-outline-primary" onclick="alert('Please use Microsoft Login to access your portal account.')">
                        <img src="odoo1.png" alt="Odoo" onerror="this.onerror=null; this.src='https://app.iqra.edu.pk/aarsol_custom_loginpage/static/img/odoo1.png';">
                        <span>Login With Odoo</span>
                    </button>

                    <span class="divider-text">Or</span>

                    <a href="microsoft-login.html" class="btn-outline-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 21 21">
                            <rect x="1" y="1" width="9" height="9" fill="#f25022" />
                            <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
                            <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
                            <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
                        </svg>
                        <span>login With Microsoft</span>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleFormSubmit(e) {
            e.preventDefault();
            window.location.href = 'microsoft-login.html';
        }
    </script>
</body>

</html>

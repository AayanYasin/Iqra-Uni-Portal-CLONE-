<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Iqra University Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #b3d9f2;
            background-image: url('iu_bg.jpg'), url('https://app.iqra.edu.pk/odoocms_assets/static/img/iu_bg.jpg');
            background-size: cover;
            background-position: center right;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Desktop Left Curve Overlay matching IU Portal */
        .curve-overlay {
            display: none;
        }

        @media (min-width: 768px) {
            .curve-overlay {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 48vw;
                min-width: 460px;
                max-width: 720px;
                height: 100vh;
                background-image: url('curve_image.png'), url('https://app.iqra.edu.pk/aarsol_custom_loginpage/static/img/image.png');
                background-size: 100% 100%;
                background-repeat: no-repeat;
                background-position: left top;
                pointer-events: none;
                z-index: 1;
            }
        }

        /* Login Container Area */
        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        @media (min-width: 768px) {
            .login-wrapper {
                padding-left: 60px;
            }
        }

        @media (min-width: 1200px) {
            .login-wrapper {
                padding-left: 80px;
            }
        }

        .login-card {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @media (min-width: 768px) {
            .login-card {
                margin: 0;
                max-width: 270px;
                background: transparent;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                box-shadow: none;
                border: none;
                padding: 10px 0;
            }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .login-label {
            display: block;
            margin-bottom: 6px;
            font-size: 12.5px;
            color: #333333;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 8px 16px;
            border: 1px solid #c8d7e6;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.85);
            font-size: 12.5px;
            color: #333333;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        @media (min-width: 768px) {
            .form-control {
                background: linear-gradient(45deg, #ffffff, transparent);
            }
        }

        .form-control:focus {
            border-color: #1D2C55;
            background: #ffffff;
        }

        .form-control::placeholder {
            color: #7a8b9e;
            font-size: 12px;
        }

        .actions-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 8px;
        }

        .btn-outline-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 7px 18px;
            border: 1px solid #1D2C55;
            border-radius: 6px;
            background: transparent;
            color: #1D2C55;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 180px;
            box-sizing: border-box;
        }

        .btn-outline-primary:hover {
            background-color: #1D2C55;
            color: #ffffff;
        }

        .btn-outline-primary img {
            height: 18px;
            width: auto;
            display: block;
        }

        .btn-outline-primary svg {
            display: block;
            flex-shrink: 0;
        }

        .divider-text {
            color: #1D2C55;
            font-size: 12px;
            font-weight: 500;
            margin: 2px 0;
        }
    </style>
</head>

<body>

    <!-- Desktop Left Curve Overlay -->
    <div class="curve-overlay"></div>

    <!-- Login Form Area -->
    <div class="login-wrapper">
        <div class="login-card">
            <form id="loginForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label class="login-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter Username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="login-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password" autocomplete="current-password">
                </div>

                <div class="actions-container">
                    <button type="button" class="btn-outline-primary" onclick="alert('Please use Microsoft Login to access your portal account.')">
                        <img src="odoo1.png" alt="Odoo" onerror="this.onerror=null; this.src='https://app.iqra.edu.pk/aarsol_custom_loginpage/static/img/odoo1.png';">
                        <span>Login With Odoo</span>
                    </button>

                    <span class="divider-text">Or</span>

                    <a href="microsoft-login.html" class="btn-outline-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 21 21">
                            <rect x="1" y="1" width="9" height="9" fill="#f25022" />
                            <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
                            <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
                            <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
                        </svg>
                        <span>login With Microsoft</span>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleFormSubmit(e) {
            e.preventDefault();
            window.location.href = 'microsoft-login.html';
        }
    </script>
</body>

</html>

                    <strong>Don't panic.</strong> If you think it's our mistake, please contact Student Service Center.
                </div>
            </div>

    <script>
        // --- Sidebar Logic ---
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // --- Dynamic Page Name Logic ---
        // This looks at the URL for "?page=Something"
        const urlParams = new URLSearchParams(window.location.search);
        let pageName = urlParams.get('page');

        // If no page name is provided in the URL, default to a generic message
        if (!pageName) {
            pageName = "Requested Page";
        }

        // 1. Update the Browser Tab Title
        document.getElementById('pageTitle').innerText = pageName + " | Not Active";

        // 2. Update the Breadcrumb text (e.g. Home > Results)
        document.getElementById('breadcrumbText').innerText = pageName;

        // 3. Update the Main Error Text (e.g. "Results is not Active.....")
        document.getElementById('errorTitle').innerHTML = pageName + " is not<br>Active.....";

    </script>

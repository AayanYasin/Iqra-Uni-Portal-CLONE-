        .divider-line {

        .datesheet-message {

            line-height: 1.4;
            margin: 35px 0;
        }

        /* --- PROFILE DROPDOWN --- */
        .profile-container { position: relative; display: inline-block; }
        .profile-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            width: 240px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-10px);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .profile-dropdown.show { display: flex; opacity: 1; transform: translateY(0); }
        .dropdown-header {
            padding: 15px;
            background: linear-gradient(135deg, #0b3d68 0%, #1a2a40 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .dropdown-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); margin-bottom: 8px; object-fit: cover; }
        .dropdown-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .dropdown-id { font-size: 11px; opacity: 0.8; }
        .dropdown-menu-list { display: flex; flex-direction: column; padding: 8px 0; }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.2s, color 0.2s;
            background: transparent;
            border: none;
            text-align: left;
            cursor: pointer;
            width: 100%;
        }
        .dropdown-item:hover { background: #f4f6f9; color: #0b3d68; }
        .dropdown-item i { font-size: 15px; color: #666; transition: color 0.2s; }
        .dropdown-item:hover i { color: #0b3d68; }
        .dropdown-item.logout { border-top: 1px solid #eee; color: #e74c3c; margin-top: 5px; padding-top: 15px; }
        .dropdown-item.logout:hover { background: #fdf2f2; color: #c0392b; }
        .dropdown-item.logout:hover i { color: #c0392b; }

    </style>
</head>

    <!-- Firebase Script and logic integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Firebase configuration matching rest of site
        const firebaseConfig = {
            apiKey: "AIzaSyA3-GjLe-n574aqPVrk8kfE2PGK06_JN88",
            authDomain: "iqrauni-clone-aayan.firebaseapp.com",
            projectId: "iqrauni-clone-aayan",
            storageBucket: "iqrauni-clone-aayan.firebasestorage.app",
            messagingSenderId: "49713197339",
            appId: "1:49713197339:web:c4aefdddff2191161623be",
            measurementId: "G-9XBBRXGD41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Fetch student profile details from Firestore
        async function fetchStudentAvatar() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "profile"));
                if (docSnap.exists() && docSnap.data()) {
                    const data = docSnap.data();
                    if(data.picUrl) {
                        document.getElementById('sidebarProfilePic').src = data.picUrl;
                        document.getElementById('navbarProfilePic').src = data.picUrl;
                        document.getElementById('dropdownProfilePic').src = data.picUrl;
                    }
                    if(data.name) {
                        document.getElementById('sidebarProfileName').innerText = data.name;
                        document.getElementById('dropdownProfileName').innerText = data.name;
                    }
                    if(data.id) {
                        document.getElementById('dropdownProfileId').innerText = data.id;
                    }
                }
            } catch(e) { console.error("Error avatar sidebar fetch: ", e); }
        }

        window.handleLogout = async function() {
            try {
                await signOut(auth);
                window.location.href = "login.html";
            } catch (error) {
                console.error("Logout error: ", error);
                alert("Failed to log out.");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchStudentAvatar();
            } else {
                window.location.href = "login.html";
            }
        });

    </script>

    <!-- Interactive UI triggers script -->
    <script>
        // Sidebar Toggles
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Sidebar Profile dropdown controls (Long press redirect, simple click toggle)
        const profilePic = document.getElementById('topProfilePic');
        const profileDropdown = document.getElementById('profileDropdown');
        let pressTimer;
        let isLongPress = false;

        function startPress(e) {
            if (e.type === 'touchstart') {
                e.preventDefault();
            }
            isLongPress = false;
            pressTimer = window.setTimeout(() => {
                isLongPress = true;
                window.location.href = "profile.html";
            }, 800);
        }

        function endPress(e) {
            clearTimeout(pressTimer);
            if (!isLongPress) {
                profileDropdown.classList.toggle('show');
            }
        }

        profilePic.addEventListener('mousedown', startPress);
        profilePic.addEventListener('mouseup', endPress);
        profilePic.addEventListener('mouseleave', () => clearTimeout(pressTimer));

        profilePic.addEventListener('touchstart', startPress);
        profilePic.addEventListener('touchend', endPress);
        profilePic.addEventListener('touchcancel', () => clearTimeout(pressTimer));

        window.addEventListener('click', function(e) {
            if (!profilePic.contains(e.target) && !profileDropdown.contains(e.target)) {
                profileDropdown.classList.remove('show');
            }
        });

    </script>

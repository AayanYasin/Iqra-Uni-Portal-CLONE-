<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        body {
            font-family: "Segoe UI", "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
            background-color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1b1b1b;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
            padding: 44px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .logo {
            height: 24px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 16px 0;
            line-height: 28px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 6px 10px;
            border: none;
            border-bottom: 1px solid #666;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-bottom-color 0.2s;
        }

        .input-group input:focus {
            border-bottom: 1px solid #0067b8;
        }
        
        .input-group input::placeholder {
            color: #666;
        }

        .error-message {
            color: #e81123;
            font-size: 15px;
            margin-bottom: 16px;
            display: none;
        }

        .links {
            font-size: 13px;
            margin-bottom: 32px;
        }

        .links a {
            color: #0067b8;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
        }

        .btn {
            padding: 6px 20px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            min-width: 108px;
            height: 32px;
            box-sizing: border-box;
        }

        .btn-secondary {
            background-color: #cccccc;
            color: #000;
        }
        
        .btn-secondary:hover {
            background-color: #999999;
        }

        .btn-primary {
            background-color: #0067b8;
            color: #fff;
        }
        
        .btn-primary:hover {
            background-color: #005da6;
        }

        /* Sign-in options styling */
        .sign-in-options-container {
            margin-top: 40px;
            border: 1px solid #ccc;
            border-left: none;
            border-right: none;
        }

        .sign-in-options {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            font-size: 15px;
            color: #1b1b1b;
            cursor: pointer;
        }
        
        .sign-in-options img {
            width: 24px;
            height: 24px;
        }
        
        /* Step 2 specific styles */
        #step2 {
            display: none;
        }
        
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            margin-bottom: 16px;
        }
        
        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        
        .back-button:hover {
            background-color: #f2f2f2;
        }

    </style>
</head>
<body>

    <div class="login-box">
        <img src="https://logincdn.msauth.net/shared/1.0/content/images/microsoft_logo_ee5c8d9fb6248c938fd0dc19370e90bd.svg" alt="Microsoft" class="logo">
        
        <!-- Step 1: Email -->
        <div id="step1">
            <h1>Sign in</h1>
            <div class="error-message" id="emailError">That Microsoft account doesn't exist. Enter a different account</div>
            <div class="input-group">
                <input type="text" id="emailInput" placeholder="Email or phone" autofocus>
            </div>
            <div class="links">
                <a href="#">Can't access your account?</a>
            </div>
            <div class="buttons">
                <button class="btn btn-secondary" onclick="window.history.back()">Back</button>
                <button class="btn btn-primary" onclick="validateEmail()">Next</button>
            </div>
            
            <div class="sign-in-options-container">
                <div class="sign-in-options">
                    <img src="https://logincdn.msauth.net/shared/1.0/content/images/signin-options_3e3f6b73c3f310c31d2c4d131a8ab8c6.svg" alt="Key">
                    Sign-in options
                </div>
            </div>
        </div>

        <!-- Step 2: Password -->
        <div id="step2">
            <div class="user-badge">
                <button class="back-button" onclick="showStep1()" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <span id="displayEmail"></span>
            </div>
            <h1>Enter password</h1>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password">
            </div>
            <div class="links">
                <a href="#">Forgot my password</a>
            </div>
            <div class="buttons">
                <button class="btn btn-primary" onclick="login()">Sign in</button>
            </div>
        </div>
    </div>

    <script>
        const validEmail = "iu04-0225-0926@iqra.edu.pk";

        function validateEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const errorElement = document.getElementById('emailError');
            
            if (email === validEmail) {
                errorElement.style.display = 'none';
                document.getElementById('displayEmail').innerText = email;
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('passwordInput').focus();
            } else {
                errorElement.style.display = 'block';
            }
        }

        function showStep1() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('emailInput').focus();
        }

        function login() {
            // For now, any password works.
            sessionStorage.setItem("isLoggedIn", "true");
            window.location.href = "index.html";
        }
        
        // Allow pressing Enter to submit
        document.getElementById('emailInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') validateEmail();
        });
        
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
